name: fluttermatch_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.4.0

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^13.0.0

  # UI
  google_fonts: ^6.2.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.0
  flutter_card_swiper: ^7.0.0

  # Storage & Security
  flutter_secure_storage: ^9.0.0

  # Image
  image_picker: ^1.0.7

  # Real-time chat
  web_socket_channel: ^2.4.0
  pusher_channels_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
